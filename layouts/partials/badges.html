<div class="post-badges">
  <a href="https://carrot.tw/" target="_blank" rel="noopener" title="carrot.tw">
    <img src="/images/carrot-badge.png" alt="Carrot Blog">
  </a>

  {{- /* 文章 front matter 設 aiAssisted = true 時，隱藏兩個「真人撰寫」徽章 */ -}}
  {{- if not (.Param "aiAssisted") }}
  <a href="https://notbyai.fyi/" target="_blank" rel="noopener" title="Written by Human, Not by AI">
    <img src="/images/badge.png" alt="真人撰寫・非AI生成">
  </a>

  <a href="https://paddletonightside.blogspot.com/2026/05/100.html?m=1" target="_blank" rel="noopener" title="100% Human">
    <img src="/images/badge-1.png" alt="100% Human">
  </a>
  {{- end }}

  <a href="https://creativecommons.org/licenses/by-nc/4.0/deed.zh-hant" target="_blank" rel="license noopener" title="CC BY-NC 4.0">
    <img src="/images/badge-2.png" alt="創用 CC 姓名標示-非商業性 4.0 國際">
  </a>
</div>

<style>
  .post-badges {
    display: flex;
    flex-wrap: nowrap;        /* 永遠排成一行 */
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 2rem 0 1rem;
    padding-top: 1rem;
    border-top: 1px solid #e0e0e0;
  }
  .post-badges a {
    display: block;
    flex: 0 1 auto;
    min-width: 0;             /* 允許整排縮小，不會換行或溢出 */
  }
  .post-badges img {
    display: block;
    height: 40px;             /* 桌機高度，改這個數字就能整體縮放 */
    width: auto;
    max-width: 100%;
    object-fit: contain;      /* 縮小時維持比例，不變形 */
    border: none;
  }
  @media (max-width: 480px) {  /* 手機：縮小高度，並把間距縮小 */
    .post-badges { gap: 6px; }
    .post-badges img { height: 28px; }
  }
  @media (max-width: 360px) {  /* 更窄的手機 */
    .post-badges img { height: 22px; }
  }
</style>
