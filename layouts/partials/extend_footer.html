{{/* ==========================================
     第一區塊：Hugo 頁面判斷與 D3.js 關聯圖 Container
   ========================================== */}}
{{ if or (eq .RelPermalink "/graph/") (eq .Type "graph") (hasPrefix .RelPermalink "/graph") }}
<div id="graph-container" style="width: 100%; height: 500px; border: 1px solid var(--border); border-radius: 8px; margin: 2rem 0; background: var(--entry);"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
  // 1.1 從 API 取得文章點與連線資料
  fetch('/index.json')
    .then(res => res.json())
    .then(data => {
      const nodes = data.map(d => ({ id: d.id, title: d.title }));
      const links = [];

      data.forEach(src => {
        src.rel.forEach(targetId => {
          if (nodes.some(n => n.id === targetId)) {
            links.push({ source: src.id, target: targetId });
          }
        });
      });

      // 1.2 初始化 SVG 畫布
      const container = document.getElementById('graph-container');
      const width = container.clientWidth;
      const height = 500;

      const svg = d3.select("#graph-container")
        .append("svg")
        .attr("width", width)
        .attr("height", height);

      // 1.3 建立 D3 力導向物理模擬器
      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(100))
        .force("charge", d3.forceManyBody().strength(-200))
        .force("center", d3.forceCenter(width / 2, height / 2));

      // 1.4 繪製關聯線段 (Links)
      const link = svg.append("g")
        .selectAll("line")
        .data(links)
        .enter().append("line")
        .attr("stroke", "#888")
        .attr("stroke-opacity", 0.6)
        .attr("stroke-width", 1.5);

      // 1.5 繪製節點群組並綁定拖拽事件 (Nodes Group & Dragging)
      const nodeGroup = svg.append("g")
        .selectAll("g")
        .data(nodes)
        .enter().append("g")
        .style("cursor", "pointer")
        .call(d3.drag()
          .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
          .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
          .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

      // 1.6 繪製圓點
      nodeGroup.append("circle")
        .attr("r", 7)
        .attr("fill", "var(--primary)");

      // 1.7 繪製節點標題文字
      nodeGroup.append("text")
        .text(d => d.title)
        .attr("x", 10)
        .attr("y", 4)
        .attr("font-size", "12px")
        .attr("fill", "var(--primary)")
        .style("pointer-events", "none");

      // 1.8 點擊節點跳轉至對應頁面
      nodeGroup.on("click", (e, d) => {
        window.location.href = d.id;
      });

      // 1.9 物理模擬時即時更新點線位置 (Tick)
      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        nodeGroup
          .attr("transform", d => `translate(${d.x},${d.y})`);
      });
    });
</script>
{{ end }}


<div id="popover-preview" class="popover-box">
  <div class="popover-header">
    <span class="popover-title" id="popover-title">載入中...</span>
  </div>
  <div class="popover-body" id="popover-body">
    正在讀取文章摘要...
  </div>
</div>


<style>
  /* 3.1 預覽浮動卡片基礎樣式 */
  .popover-box {
    position: fixed;
    width: 320px;
    max-height: 220px;
    background: var(--entry, #2e2e33);
    color: var(--primary, #cccccc);
    border: 1px solid var(--border, #444);
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    pointer-events: none; /* 避免滑鼠干擾卡片生成 */
    transition: opacity 0.2s ease, transform 0.2s ease;
    transform: translateY(8px);
    overflow: hidden;
    backdrop-filter: blur(8px);
  }

  /* 3.2 啟用狀態 (卡片顯示) */
  .popover-box.is-active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  /* 3.3 卡片標題樣式 */
  .popover-title {
    font-weight: 700;
    font-size: 15px;
    color: var(--primary);
    margin-bottom: 6px;
    display: block;
    border-bottom: 1px solid var(--border, #444);
    padding-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 3.4 卡片內文摘要樣式 (限制最多顯示 5 行) */
  .popover-body {
    font-size: 13px;
    line-height: 1.5;
    opacity: 0.85;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 🛡️ 關鍵修復 3.5：雙重防護！行動裝置 / 觸控螢幕強制隱藏預覽框 */
  @media (hover: none) or (pointer: coarse) {
    .popover-box,
    .popover-box.is-active {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }
  }
</style>


<script>
  document.addEventListener("DOMContentLoaded", function () {
    // 🛡️ 關鍵修復 4.1：檢查是否具備真實滑鼠 Hover 能力，手機/平板直接停止執行 JS
    const hasHoverSupport = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    if (!hasHoverSupport) return;

    const popover = document.getElementById("popover-preview");
    const popoverTitle = document.getElementById("popover-title");
    const popoverBody = document.getElementById("popover-body");

    let hoverTimer = null;
    const cache = {}; // 快取機制，避免重複 Request 同一個頁面

    // 4.2 尋找文章內容區內的所有連結
    const links = document.querySelectorAll(".post-content a");

    links.forEach(link => {
      // 4.3 篩選條件：排除外連、錨點、檔案與 mailto 連結
      const href = link.getAttribute("href");
      if (!href || href.startsWith("#") || href.startsWith("mailto:") || !link.hostname.includes(window.location.hostname)) {
        return;
      }

      // 4.4 滑鼠移入：延遲 300ms 觸發預覽
      link.addEventListener("mouseenter", (e) => {
        hoverTimer = setTimeout(() => {
          showPopover(link, e);
        }, 300);
      });

      // 4.5 滑鼠移出：取消定時器並隱藏預覽卡片
      link.addEventListener("mouseleave", () => {
        clearTimeout(hoverTimer);
        hidePopover();
      });

      // 4.6 滑鼠移動：卡片位置即時跟隨游標
      link.addEventListener("mousemove", (e) => {
        positionPopover(e);
      });
    });

    // 4.7 顯示 Popover 並讀取預覽內容
    function showPopover(link, event) {
      const targetUrl = link.href;

      popoverTitle.textContent = link.innerText || "文章預覽";
      popoverBody.textContent = "讀取中...";
      positionPopover(event);
      popover.classList.add("is-active");

      // 4.7a 優先使用快取
      if (cache[targetUrl]) {
        renderContent(cache[targetUrl]);
        return;
      }

      // 4.7b 透過 Fetch 抓取遠端 HTML
      fetch(targetUrl)
        .then(res => {
          if (!res.ok) throw new Error("頁面載入失敗");
          return res.text();
        })
        .then(html => {
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, "text/html");

          const title = doc.querySelector(".post-title")?.innerText || doc.title;
          let bodyText = doc.querySelector(".post-content")?.innerText || "";
          
          bodyText = bodyText.replace(/\s+/g, ' ').trim();

          const data = { title, bodyText };
          cache[targetUrl] = data; // 寫入快取
          renderContent(data);
        })
        .catch(() => {
          popoverBody.textContent = "無法載入此頁面的預覽。";
        });
    }

    // 4.8 將資料渲染至 Popover 卡片
    function renderContent(data) {
      popoverTitle.textContent = data.title;
      popoverBody.textContent = data.bodyText || "此文章尚無內文摘要。";
    }

    // 4.9 計算並修正 Popover 位置 (防止超出螢幕邊界)
    function positionPopover(e) {
      const padding = 15;
      let left = e.clientX + padding;
      let top = e.clientY + padding;

      if (left + 330 > window.innerWidth) {
        left = e.clientX - 335;
      }

      if (top + 230 > window.innerHeight) {
        top = e.clientY - 235;
      }

      popover.style.left = `${left}px`;
      popover.style.top = `${top}px`;
    }

    // 4.10 隱藏 Popover 卡片
    function hidePopover() {
      popover.classList.remove("is-active");
    }
  });
</script>
