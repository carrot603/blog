{{- define "main" }}
<article class="post-single">
  <style>
    #graph-fullscreen-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: var(--bg, #1d1e20);
    }

    .graph-hint {
      position: absolute;
      bottom: 20px;
      right: 25px;
      font-size: 14px;
      color: var(--primary);
      opacity: 0.7;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .graph-back-btn {
      position: absolute;
      top: 20px;
      left: 25px;
      z-index: 10000;
      padding: 8px 16px;
      background: var(--entry, #2e2e33);
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .graph-back-btn:hover {
      background: var(--tertiary);
      transform: translateY(-2px);
    }
  </style>

  <div id="graph-fullscreen-wrapper">
    <a href="/" class="graph-back-btn">← 返回首頁</a>
    <div id="graph-container" style="width: 100%; height: 100%;"></div>
    <div class="graph-hint">
      💡 滾輪縮放｜按住空白處拖拽｜點擊節點跳轉文章
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      fetch('/index.json')
        .then(res => res.json())
        .then(data => {
          const nodes = data.map(d => ({ id: d.id, title: d.title }));
          const links = [];

          // 🎯 終極超強連線比對：直接用正則抓取內文所有的 href 連結
          data.forEach(source => {
            if (!source.content) return;
            
            // 抓出 source 文章內所有 href="xxx" 的超連結目標
            const hrefMatches = [...source.content.matchAll(/href=["']([^"']+)["']/g)].map(m => m[1]);

            data.forEach(target => {
              if (source.id !== target.id) {
                // 檢查 href 裡面有沒有包含 target 的任何特徵 (ID、相對路徑、完整URL)
                const targetRel = target.id.replace(/\/$/, "");
                const targetFull = target.permalink ? target.permalink.replace(/\/$/, "") : "";

                const isLinked = hrefMatches.some(url => {
                  const cleanUrl = url.replace(/\/$/, "");
                  return cleanUrl.includes(targetRel) || (targetFull && cleanUrl.includes(targetFull));
                });

                if (isLinked) {
                  links.push({ source: source.id, target: target.id });
                }
              }
            });
          });

          console.log("偵測到的連線資料：", links); // 可以打開 F12 Console 查看是不是有抓到線

          const container = document.getElementById('graph-container');
          const width = window.innerWidth;
          const height = window.innerHeight;

          const svg = d3.select("#graph-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

          const g = svg.append("g");

          const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on("zoom", (event) => {
              g.attr("transform", event.transform);
            });

          svg.call(zoom);

          // 🎯 調整間距：distance 從 160 縮小到 70，排斥力 strength 從 -350 弱化到 -120，讓點陣緊湊在一起！
          const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(70)) 
            .force("charge", d3.forceManyBody().strength(-120))          
            .force("center", d3.forceCenter(width / 2, height / 2));

          const link = g.append("g")
            .selectAll("line")
            .data(links)
            .enter().append("line")
            .attr("stroke", "var(--primary)")
            .attr("stroke-opacity", 0.6)
            .attr("stroke-width", 2);

          const nodeGroup = g.append("g")
            .selectAll("g")
            .data(nodes)
            .enter().append("g")
            .style("cursor", "pointer")
            .call(d3.drag()
              .on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
              .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
              .on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

          nodeGroup.append("circle")
            .attr("r", 8)
            .attr("fill", "var(--primary)");

          nodeGroup.append("text")
            .text(d => d.title)
            .attr("x", 12)
            .attr("y", 4)
            .attr("font-size", "15px")
            .attr("font-weight", "600")
            .attr("fill", "var(--primary)")
            .style("pointer-events", "none");

          nodeGroup.on("click", (e, d) => {
            window.location.href = d.id;
          });

          simulation.on("tick", () => {
            link
              .attr("x1", d => d.source.x)
              .attr("y1", d => d.source.y)
              .attr("x2", d => d.target.x)
              .attr("y2", d => d.target.y);

            nodeGroup
              .attr("transform", d => `translate(${d.x},${d.y})`);
          });

          window.addEventListener('resize', () => {
            svg.attr("width", window.innerWidth).attr("height", window.innerHeight);
          });
        })
        .catch(err => console.error("Graph Error:", err));
    });
  </script>
</article>
{{- end }}
