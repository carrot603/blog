<div class="puzzle-wrapper">
  <div class="puzzle-header">
    <div class="puzzle-title">Word Puzzle</div>
    <div class="sub">點選格子後輸入英文字母（不分大小寫），可填橫向、直向與斜向。</div>
  </div>

  <div class="wrap">
    <div class="gridbox">
      <div class="grid" id="grid"></div>
      <div id="win">🎉 恭喜全部完成！</div>
      <div class="bar">
        <span id="prog">已完成 0 / 11</span>
        <span><button id="hint" type="button">提示</button> <button id="reset" type="button">重來</button></span>
      </div>
    </div>
    <div class="clues" id="clues"></div>
  </div>
  <div id="toast"></div>
</div>

<style>
/* 使用 .puzzle-wrapper 容器隔離，避免影響全站樣式與頂部排版 */
.puzzle-wrapper {
  --bg: #faf8f4;
  --fg: #222;
  --muted: #777;
  --cell: #fff;
  --line: #c9c3b8;
  --act: #fff1b8;
  --cur: #ffd54a;
  --ok: #c8ecd0;
  --okfg: #14632b;
  --bad: #fbd0d0;
  --acc: #2a6fdb;
  --card: #fff;
  
  margin: 1rem 0;
  padding: 12px;
  background: var(--bg);
  color: var(--fg);
  border-radius: 12px;
  border: 1px solid var(--line);
  font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

/* 暗色模式自動適應 */
@media (prefers-color-scheme: dark) {
  .puzzle-wrapper {
    --bg: #1c1b19;
    --fg: #eee;
    --muted: #999;
    --cell: #2a2927;
    --line: #4a4743;
    --act: #4a4220;
    --cur: #8a6d10;
    --ok: #1f4d2b;
    --okfg: #9be3ae;
    --bad: #5a2626;
    --acc: #7ab0ff;
    --card: #262522;
  }
}

/* 修正頂部空白：將原 h1 改為 div 並緊貼頂部 */
.puzzle-title {
  font-size: 20px;
  font-weight: bold;
  margin: 0;
  text-align: center;
  padding: 4px 12px 0;
}
.puzzle-wrapper .sub {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin: 4px 12px 12px;
}
.puzzle-wrapper .wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
  padding: 0;
}
.puzzle-wrapper .gridbox {
  flex: 1 1 340px;
  max-width: 560px;
}
.puzzle-wrapper .grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 2px;
}
.puzzle-wrapper .c {
  position: relative;
  aspect-ratio: 1;
}
.puzzle-wrapper .c input {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  padding: 0;
  text-align: center;
  font: 700 clamp(13px, 4.2vw, 24px) inherit;
  font-family: inherit;
  text-transform: uppercase;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--cell);
  color: var(--fg);
  outline: none;
  caret-color: transparent;
}
.puzzle-wrapper .c.act input { background: var(--act); }
.puzzle-wrapper .c.cur input { background: var(--cur); border-color: var(--acc); }
.puzzle-wrapper .c.bad input { background: var(--bad); }
.puzzle-wrapper .c.ok input { background: var(--ok); color: var(--okfg); animation: pop .4s; }
.puzzle-wrapper .n {
  position: absolute;
  top: 1px;
  left: 3px;
  font-size: 9px;
  color: var(--muted);
  pointer-events: none;
}
@keyframes pop { 50% { transform: scale(1.15); } }
.puzzle-wrapper .bar {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  margin-top: 10px;
}
.puzzle-wrapper button {
  font: inherit;
  font-size: 14px;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--fg);
  cursor: pointer;
}
.puzzle-wrapper .clues {
  flex: 1 1 280px;
  max-width: 420px;
  background: var(--card);
  border-radius: 12px;
  padding: 6px 16px 12px;
  align-self: flex-start;
}
.puzzle-wrapper .clues h3 {
  font-size: 15px;
  margin: 12px 0 4px;
  color: var(--acc);
}
.puzzle-wrapper .clues ul { list-style: none; margin: 0; padding: 0; }
.puzzle-wrapper .clues li {
  padding: 6px 4px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 15px;
  display: flex;
  gap: 6px;
}
.puzzle-wrapper .clues li:hover, .puzzle-wrapper .clues li.act { background: var(--act); }
.puzzle-wrapper .clues li b { min-width: 20px; }
.puzzle-wrapper .clues li.done { color: var(--okfg); }
.puzzle-wrapper .clues li.done .t::before { content: "✓ "; }
.puzzle-wrapper .len { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
#toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 40px);
  background: var(--okfg);
  color: var(--bg);
  padding: 10px 20px;
  border-radius: 24px;
  font-weight: 700;
  opacity: 0;
  transition: .3s;
  pointer-events: none;
  z-index: 99999;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#win { display: none; text-align: center; font-size: 18px; font-weight: 700; color: var(--okfg); margin-top: 10px; }
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const W=[
    ["library","我喜歡逛？",0,0,1,1],
    ["carrot","我喜歡吃？",1,10,1,0],
    ["happy","我每天都很…",2,6,1,0],
    ["blog","我寫的…",3,8,1,1],
    ["Taipei","現居城市",4,3,0,1],
    ["Taichung","我的家鄉",4,3,1,0],
    ["piano","我的主修",5,6,0,1],
    ["read","我的嗜好",6,8,1,1],
    ["walk","去路上…",7,10,1,0],
    ["scroll","我不會 doom...",9,5,0,1],
    ["morning","一日之計在於？",10,0,0,1]
  ].map(([a,q,r,c,dr,dc])=>({a:a.toLowerCase(),A:a,q,r,c,dr,dc,dir:dr&&dc?"斜":dr?"直":"橫",done:false,cells:[...a].map((_,i)=>(r+dr*i)+","+(c+dc*i))}));

  const cells={}, grid=document.getElementById("grid");
  if (!grid) return;

  W.forEach((w,wi)=>w.cells.forEach((k,i)=>{(cells[k]=cells[k]||{ans:w.a[i],words:[]}).words.push(wi)}));
  
  const nums={}; let n=0;
  [...W].sort((x,y)=>x.r-y.r||x.c-y.c).forEach(w=>{const k=w.r+","+w.c;if(!nums[k])nums[k]=++n;w.num=nums[k]});

  let act=0, cur=null, wasFocused=false;
  for(let r=0;r<12;r++) for(let c=0;c<12;c++){
    const k=r+","+c, d=document.createElement("div"); d.className="c";
    if(cells[k]){
      const inp=document.createElement("input");
      inp.maxLength=2; inp.autocomplete="off"; inp.autocapitalize="off"; inp.spellcheck=false;
      inp.setAttribute("aria-label","第"+(r+1)+"列第"+(c+1)+"欄");
      cells[k].el=inp; cells[k].d=d; d.appendChild(inp);
      if(nums[k]){const s=document.createElement("span");s.className="n";s.textContent=nums[k];d.appendChild(s)}
      
      inp.onfocus=()=>{cur=k;if(!W[act].cells.includes(k))act=cells[k].words[0];render()};
      inp.onpointerdown=()=>{wasFocused=document.activeElement===inp};
      inp.onclick=()=>{const ws=cells[k].words;if(wasFocused&&ws.length>1){act=ws[(ws.indexOf(act)+1)%ws.length];render()}};
      inp.oninput=()=>{
        const v=inp.value.replace(/[^a-zA-Z]/g,"").slice(-1).toUpperCase();inp.value=v;
        if(v){const cs=W[act].cells,i=cs.indexOf(k);if(i>=0&&i<cs.length-1)cells[cs[i+1]].el.focus()}
        check();
      };
      inp.onkeydown=e=>{
        const dirs={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
        if(dirs[e.key]){e.preventDefault();let[a,b]=dirs[e.key],rr=r,cc=c;for(let s=0;s<12;s++){rr+=a;cc+=b;if(cells[rr+","+cc]){cells[rr+","+cc].el.focus();break}}}
        else if(e.key==="Backspace"&&!inp.value){e.preventDefault();const cs=W[act].cells,i=cs.indexOf(k);if(i>0){const p=cells[cs[i-1]].el;p.value="";p.focus();check()}}
      };
    }
    grid.appendChild(d);
  }

  const cl=document.getElementById("clues");
  ["橫","直","斜"].forEach(dir=>{
    const h=document.createElement("h3");h.textContent={橫:"橫向 →",直:"直向 ↓",斜:"斜向 ↘"}[dir];cl.appendChild(h);
    const ul=document.createElement("ul");
    W.map((w,i)=>[w,i]).filter(([w])=>w.dir===dir).sort((x,y)=>x[0].num-y[0].num).forEach(([w,i])=>{
      const li=document.createElement("li");li.id="q"+i;
      li.innerHTML=`<b>${w.num}</b><span class="t">${w.q}</span><span class="len">${w.a.length} 個字母</span>`;
      li.onclick=()=>{act=i;const k=w.cells.find(k=>!cells[k].el.value)||w.cells[0];cells[k].el.focus();render()};
      ul.appendChild(li);
    });
    cl.appendChild(ul);
  });

  const st=w=>{const v=w.cells.map(k=>cells[k].el.value.toLowerCase());return v.includes("")?"p":v.join("")===w.a?"ok":"bad"};
  function render(){
    const aw=W[act];
    for(const k in cells){
      const c=cells[k],cn=c.d.classList,s=c.words.map(i=>W[i]);
      cn.toggle("act",aw.cells.includes(k));cn.toggle("cur",k===cur);
      cn.toggle("ok",s.some(w=>w.done));cn.toggle("bad",!s.some(w=>w.done)&&s.some(w=>st(w)==="bad"));
    }
    W.forEach((w,i)=>{const li=document.getElementById("q"+i);if(li){li.classList.toggle("act",i===act);li.classList.toggle("done",w.done)}});
    const d=W.filter(w=>w.done).length;
    document.getElementById("prog").textContent=`已完成 ${d} / ${W.length}`;
    document.getElementById("win").style.display=d===W.length?"block":"none";
  }

  let tt;
  function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}
  function check(){
    W.forEach(w=>{
      const s=st(w)==="ok";
      if(s&&!w.done){w.done=true;toast(W.every(x=>x.done)?"🎉 全部答對了！太棒了！":`✓ 答對了！${w.A}（${w.q}）`)}
      else if(!s&&w.done)w.done=false;
    });
    render();
  }

  document.getElementById("hint").onclick=()=>{
    const k=W[act].cells.find(k=>cells[k].el.value.toLowerCase()!==cells[k].ans);
    if(k){cells[k].el.value=cells[k].ans.toUpperCase();cells[k].el.focus();check()}
  };
  document.getElementById("reset").onclick=()=>{
    for(const k in cells)cells[k].el.value="";W.forEach(w=>w.done=false);render();cells[W[act].cells[0]].el.focus();
  };
  render();
});
</script>
