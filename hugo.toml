baseURL = 'https://carrot.tw/'
languageCode = 'zh-tw'
title = 'Carrot Blog'
theme = "PaperMod"
hasCJKLanguage = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML"]

[params]
  defaultTheme = "dark"
  ShowReadingTime = true   
  ShowShareButtons = false   
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowWordCount = true
  hideMeta = false
  ShowBreadCrumbs = true
  images = ["/share.png"]

[params.label]
  text = "Carrot" 
  textWithIcon = false

[params.assets]
  favicon = "/favicon.png"
  favicon32x32 = "/favicon.png"
  apple_touch_icon = "/apple-touch-icon.png"

[params.profileMode]
  enabled = true
  title = "我是一根蘿蔔🥕"

[[menu.main]]
  name = "🥕"
  url = "/"
  weight = 10

[[menu.main]]
  name = "📝"
  url = "/posts/"
  weight = 20

[[menu.main]]
    name = "👤"
    url = "/posts/about/"
    weight = 30

[[menu.main]]
  name = "🎲"
  url = "/random/"
  weight = 50

[[menu.main]]
  name = "🔎"
  url = "/search/"
  weight = 60

[params.searchApp]
  limit = 20          
  showScores = false
  secure = false
  mainSections = ["posts"]
